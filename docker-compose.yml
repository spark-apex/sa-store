# ========================================
# SA-Store 一键启动
# ========================================
# 开发: docker compose up postgres     （只启数据库）
# 全栈: docker compose up -d           （数据库+后端）
# 日志: docker compose logs -f backend

services:
  # ==================== 数据库 ====================
  postgres:
    image: docker.m.daocloud.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: sa_store
      POSTGRES_USER: sa_store
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sa_store_dev}
    ports:
      - "53003:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sa_store" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
