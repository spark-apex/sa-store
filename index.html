<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SA-Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body,
        #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* 启动页 */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #F5F6F8;
            transition: opacity 0.35s ease;
        }

        #splash.hide {
            opacity: 0;
            pointer-events: none;
        }

        #splash svg {
            width: 56px;
            height: 56px;
        }

        #splash .name {
            margin-top: 14px;
            font-weight: 700;
            font-size: 16px;
            color: #1296DB;
            letter-spacing: 1px;
        }

        #splash .sub {
            margin-top: 4px;
            font-size: 10px;
            color: rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
        }

        /* 主题预设 */
        :root {
            --bg-deepest: #F5F6F8;
        }

        [data-theme="dark"] {
            --bg-deepest: #08080c;
        }

        [data-theme="dark"] #splash {
            background: #08080c;
        }

        [data-theme="dark"] #splash .name {
            color: #80D8FF;
        }

        [data-theme="dark"] #splash .sub {
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
    <script>
        // 同步读取主题避免闪烁
        const t = localStorage.getItem('sa-store-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.setAttribute('data-theme', 'light');
    </script>
</head>

<body>
    <div id="splash">
        <!-- 星火极点 Logo 简化版 -->
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#B8D4F0" />
                    <stop offset="100%" stop-color="#D0E4F8" />
                </linearGradient>
                <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#8BBDE8" />
                    <stop offset="100%" stop-color="#B0D2F0" />
                </linearGradient>
                <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#4A9DE0" />
                    <stop offset="100%" stop-color="#6FB5E8" />
                </linearGradient>
            </defs>
            <path d="M8 38 L32 26 L56 38 L32 50 Z" fill="url(#g1)" />
            <path d="M8 30 L32 18 L56 30 L32 42 Z" fill="url(#g2)" />
            <path d="M8 22 L32 10 L56 22 L32 34 Z" fill="url(#g3)" />
        </svg>
        <div class="name">SA-Store</div>
        <div class="sub">应用商店</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
